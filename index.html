<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taksi Salystyr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: ride-app route card + map on the left, ranked apps on the right; one column on phones */
:root{
  --bg:#eceff1; --card:#ffffff; --ink:#0f1417; --sub:#5d6870; --line:#dfe4e7; --soft:#f4f6f7;
  --accent:#0b6fb8; --accent-ink:#ffffff; --good:#0f8a4f; --good-soft:#e3f4ea; --warn:#b54708;
  --map-a:#dde6ea; --map-b:#cfdbe1;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f12; --card:#151b1f; --ink:#eef2f4; --sub:#97a3aa; --line:#263037; --soft:#1c2429;
  --accent:#4aa8f0; --accent-ink:#06121c; --good:#3ecf86; --good-soft:#123323; --warn:#f5a25a;
  --map-a:#1a242a; --map-b:#212d34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f12; --card:#151b1f; --ink:#eef2f4; --sub:#97a3aa; --line:#263037; --soft:#1c2429;
  --accent:#4aa8f0; --accent-ink:#06121c; --good:#3ecf86; --good-soft:#123323; --warn:#f5a25a;
  --map-a:#1a242a; --map-b:#212d34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:16px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--sub);letter-spacing:0}
.tools{display:flex;gap:8px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:52vw}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.lang button{font:inherit;font-size:13px;font-weight:600;border:none;background:none;color:var(--sub);padding:6px 9px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.main{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:920px){.main{grid-template-columns:400px 1fr;align-items:start}}
.card{background:var(--card);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.left{display:grid;gap:16px;min-width:0}

/* route */
.route{display:grid;grid-template-columns:22px 1fr 40px;column-gap:10px;align-items:center}
.rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;height:100%;padding-block:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.dot.to{border-radius:2px;background:var(--accent)}
.rail .ln{flex:1;width:2px;background:var(--line);margin:4px 0}
.inp{position:relative}
.inp input{font:inherit;font-size:16px;width:100%;border:none;background:var(--soft);color:var(--ink);border-radius:12px;padding:12px}
.inp input::placeholder{color:var(--sub)}
.inp + .inp{margin-top:8px}
.swap{grid-row:1/3;grid-column:3;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:20;max-height:260px;overflow:auto}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:none;color:var(--ink);padding:10px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--soft)}
.sugg small{color:var(--sub);display:block;font-size:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qp{font:inherit;font-size:13px;border:none;background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.qp svg.i{width:14px;height:14px}

/* map */
.mapcard{padding:0;overflow:hidden;position:relative}
#map{height:280px;width:100%;background:var(--map-a)}
@media (min-width:920px){#map{height:320px}}
.maphint{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5}
.maphint svg.i{width:15px;height:15px;color:var(--sub)}
#schem{width:100%;height:100%;display:block}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.adj{display:grid;gap:6px}
.adj .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:12.5px;line-height:1.2;border:none;background:none;color:var(--sub);border-radius:9px;padding:8px 2px;cursor:pointer;display:grid;justify-items:center;gap:3px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:12px;color:var(--sub);font-weight:500}
.maplink{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;text-decoration:none;font-size:14px}
.maplink:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* results */
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:18px;font-weight:900;text-wrap:balance}
.rhead span{font-size:13px;color:var(--sub)}
.apps{display:grid}
.app{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.app:first-child{border-top:none}
.app.na{opacity:.55}
.ic{grid-row:1/3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;letter-spacing:-.02em}
.nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.nm .tn{font-weight:500;font-size:13px;color:var(--sub)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--good-soft);color:var(--good)}
.pill.warn{background:transparent;color:var(--warn);padding:0;font-weight:500}
.ds{font-size:13px;color:var(--sub);grid-column:2;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.ds .w{display:inline-flex;gap:4px;align-items:center}
.ds svg.i{width:13px;height:13px}
.pr{grid-row:1/3;grid-column:3;text-align:right;font-variant-numeric:tabular-nums}
.pr b{display:block;font-size:19px;font-weight:700;white-space:nowrap}
.pr small{font-size:12px;color:var(--sub);white-space:nowrap}
.app.best .pr b{color:var(--good)}
.go{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;text-decoration:none;border-radius:10px;padding:7px 11px;background:var(--soft);color:var(--ink)}
button.btn{border:none;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn svg.i{width:14px;height:14px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub)}
.banner b{color:var(--ink)}
.quotes .qgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.quotes label{display:grid;gap:4px;font-size:13px;font-weight:500}
.quotes input{font:inherit;font-variant-numeric:tabular-nums;width:100%;border:none;background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.qout{font-size:15px}
.qout b{color:var(--good)}
.qhint{color:var(--sub);font-size:13px}
details.how{font-size:14px;color:var(--sub)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:700}
details.how p{max-width:72ch}
details.how a{color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.go{grid-column:1/4}}
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>

<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark"><svg class="i"><use href="#i-pin"/></svg></div><div>Taksi Salystyr<small data-t="tagline"></small></div></div>
    <div class="tools">
      <select id="city" aria-label="City"></select>
      <div class="lang" role="group" aria-label="Language">
        <button data-l="kk" aria-pressed="true">ҚАЗ</button><button data-l="ru" aria-pressed="false">РУС</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <section class="card">
        <div class="route">
          <div class="rail"><span class="dot"></span><span class="ln"></span><span class="dot to"></span></div>
          <div class="inp"><input id="from" autocomplete="off"><div class="sugg" id="s-from" hidden></div></div>
          <button class="swap" id="swap"><svg class="i"><use href="#i-swap"/></svg></button>
          <div class="inp"><input id="to" autocomplete="off"><div class="sugg" id="s-to" hidden></div></div>
        </div>
        <div class="quick" id="quick"></div>
        <div class="adj">
          <span class="label" data-t="classLabel"></span>
          <div class="seg" id="cls"></div>
        </div>
        <div class="adj">
          <span class="label" data-t="condLabel"></span>
          <div class="seg" id="cond"></div>
        </div>
      </section>

      <section class="card mapcard">
        <div id="map"><svg id="schem" aria-hidden="true"></svg></div>
        <div class="maphint" id="maphint"><svg class="i"><use href="#i-info"/></svg><span></span></div>
      </section>

      <section class="card">
        <div class="stats">
          <div class="stat"><b id="kmv">–</b><span data-t="km"></span></div>
          <div class="stat"><b id="minv">–</b><span data-t="min"></span></div>
        </div>
        <div class="adj">
          <div class="row"><span data-t="adjust"></span><span id="srcnote"></span></div>
          <input type="range" id="km" min="1" max="60" step="0.5" value="8">
        </div>
        <a class="maplink" id="maplink" href="#" target="_blank" rel="noopener"><svg class="i"><use href="#i-map"/></svg><span data-t="open2gis"></span></a>
      </section>
    </div>

    <div style="display:grid;gap:16px;min-width:0">
      <section class="card" aria-live="polite">
        <div class="rhead"><h2 id="rtitle"></h2><span id="rsub"></span></div>
        <div class="apps" id="apps"></div>
      </section>

      <section class="card quotes">
        <div class="rhead"><h2 data-t="qTitle"></h2><span data-t="qSub"></span></div>
        <div class="qgrid" id="qgrid"></div>
        <div class="qout" id="qout"></div>
      </section>

      <div class="banner" id="mode"><svg class="i"><use href="#i-info"/></svg><span></span></div>

      <section class="card">
        <details class="how">
          <summary data-t="howTitle"></summary>
          <div id="howBody"></div>
          <div class="tbl"><table><thead><tr><th data-t="thCity"></th><th data-t="thBase"></th><th data-t="thKm"></th></tr></thead><tbody id="tbl"></tbody></table></div>
          <p data-t="sources"></p>
        </details>
      </section>
    </div>
  </div>
</div>

      var sc=Math.min((W-2*pad)/sw,(H-2*pad-30)/sh),ox=(W-sw*sc)/2,oy=(H-30-sh*sc)/2;
      var P=function(p){return [ox+(p.lon-minLo)*k*sc, oy+(maxLa-p.lat)*sc]};
      var pa=P(a),pb=P(b),mx=(pa[0]+pb[0])/2+(pb[1]-pa[1])*.15,my=(pa[1]+pb[1])/2-(pb[0]-pa[0])*.15;
      body+="<path d='M"+pa[0]+","+pa[1]+" Q"+mx+","+my+" "+pb[0]+","+pb[1]+"' stroke='var(--accent)' stroke-width='5' fill='none' stroke-linecap='round'/>"+
        "<circle cx='"+pa[0]+"' cy='"+pa[1]+"' r='9' fill='var(--ink)'/><text x='"+pa[0]+"' y='"+(pa[1]+4)+"' text-anchor='middle' font-size='11' font-weight='700' fill='var(--bg)'>A</text>"+
        "<rect x='"+(pb[0]-9)+"' y='"+(pb[1]-9)+"' width='18' height='18' rx='4' fill='var(--accent)'/><text x='"+pb[0]+"' y='"+(pb[1]+4)+"' text-anchor='middle' font-size='11' font-weight='700' fill='var(--accent-ink)'>B</text>";
    }
    svg.innerHTML=body;
  }

  // ---------- place search ----------
  function local(q){
    q=q.trim().toLowerCase();
    return places().filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>-1||p[1].toLowerCase().indexOf(q)>-1})
      .map(function(p){return {name:L(p),pair:[p[0],p[1]],ic:p[2],lat:p[3],lon:p[4]}});
  }
  function setupInput(which){
    var inp=$(which),box=$("s-"+which),timer=null;
    function show(items){
      if(!items.length){box.hidden=true;return}
      box.innerHTML="";
      items.slice(0,8).forEach(function(p){
        var b=document.createElement("button");b.type="button";
        b.innerHTML=icon(p.ic||"pin")+"<span>"+esc(p.name)+(p.sub?"<small>"+esc(p.sub)+"</small>":"")+"</span>";
        b.addEventListener("mousedown",function(ev){ev.preventDefault();pick(which,p)});
        box.appendChild(b);
      });
      box.hidden=false;
    }
    function search(){
      var q=inp.value;
      if(DGIS_KEY&&q.trim().length>1){
        var c=city();
        fetch("https://catalog.api.2gis.com/3.0/suggests?q="+encodeURIComponent(q)+"&location="+c[7]+","+c[6]+"&locale="+(lang==="ru"?"ru_KZ":"kk_KZ")+"&fields=items.point,items.address_name&key="+encodeURIComponent(DGIS_KEY))
          .then(function(r){return r.json()}).then(function(j){
            var items=((j.result&&j.result.items)||[]).filter(function(x){return x.point}).map(function(x){
              return {name:x.name||x.full_name,sub:x.address_name||"",lat:x.point.lat,lon:x.point.lon}});
            show(items.length?items:local(q));
          }).catch(function(){show(local(q))});
      } else show(local(q));
    }
    inp.addEventListener("focus",search);
    inp.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(search,220)});
    inp.addEventListener("blur",function(){setTimeout(function(){box.hidden=true},120)});
  }
  function pick(which,p){
    state[which]={name:p.name,pair:p.pair||null,lat:p.lat,lon:p.lon};
    $(which).value=p.name;$("s-"+which).hidden=true;
    updateRoute();
  }
  setupInput("from");setupInput("to");
  $("swap").addEventListener("click",function(){
    var f=state.from;state.from=state.to;state.to=f;
    $("from").value=state.from?state.from.name:"";$("to").value=state.to?state.to.name:"";updateRoute();
  });
  function renderQuick(){
    var q=$("quick");q.innerHTML="";
    places().slice(0,4).forEach(function(p){
      var b=document.createElement("button");b.className="qp";b.type="button";
      b.innerHTML=icon(p[2])+esc(L(p));
      b.addEventListener("click",function(){pick(state.from&&!state.to?"to":(state.from?"to":"from"),{name:L(p),pair:[p[0],p[1]],lat:p[3],lon:p[4]})});
      q.appendChild(b);
    });
  }
  $("km").addEventListener("input",function(){state.km=+this.value;state.min=minutesFor(state.km);state.src="manual";render()});
  $("city").addEventListener("change",function(){
    state.city=+this.value;try{localStorage.setItem("kz-taxi-city",this.value)}catch(e){}
    state.from=state.to=null;state.geom=null;$("from").value=$("to").value="";
    state.km=8;state.min=minutesFor(8);state.src="manual";
    if(map){var c=city();map.setCenter([c[7],c[6]]);map.setZoom(11)}
    renderQuick();render();drawMap();
  });
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){lang=b.dataset.l;try{localStorage.setItem("kz-taxi-lang",lang)}catch(e){}applyLang()})});

  // ---------- pricing ----------
  function prices(){
    var c=city(),k=state.cond,m=CMULT[state.cls],ci=CONDS.indexOf(k),bad=k==="weather"||k==="night";
    var base=Math.max(c[3],c[3]+c[4]*state.km+PER_MIN*state.min)*m;
    var y=base*SURGE[k],ind=base*.88*BID[k],ap=base*.92*BID[k],w=t().wait,tg=t().tag;
    return {
      yandex:{lo:y,hi:y,tag:k==="normal"?tg.km:tg.surge+SURGE[k],wait:w.fast[ci]},
      uber:{lo:y,hi:y*1.03,tag:tg.shared,wait:w.fast[ci]},
      indrive:{lo:ind*.9,hi:ind*1.1,bid:true,tag:tg.bid,wait:w.indrive[ci],risk:bad},
      aparu:{lo:ap*.9,hi:ap*1.1,bid:true,tag:tg.bid,wait:w.aparu[ci],risk:bad},
      qajet:{lo:base*.72,hi:base*.72,tag:tg.nosurge,wait:w.qajet[ci],risk:k!=="normal"}
    };
  }
  function deepLink(a){
    if(a.id==="yandex"&&state.from&&state.to){
      return "https://3.redirect.appmetrica.yandex.com/route?start-lat="+state.from.lat+"&start-lon="+state.from.lon+
        "&end-lat="+state.to.lat+"&end-lon="+state.to.lon+"&tariffClass="+YCLASS[state.cls]+"&ref=salystyr&lang="+(lang==="ru"?"ru":"kk")+"&appmetrica_tracking_id=1178268795219780156";
    }
    return null;
  }
  function copyDest(btn){
    if(!state.to)return;
    var txt=state.to.name,lab=btn.querySelector("span");
    var done=function(){lab.textContent=t().copied;setTimeout(function(){lab.textContent=t().copyDest},1500)};
    var fail=function(){lab.textContent=txt;btn.style.userSelect="all"};
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
  }

  function render(){
    $("kmv").textContent=state.km.toLocaleString("ru-RU");$("minv").textContent=state.min;
    $("km").value=Math.min(60,state.km);
    $("srcnote").textContent=t().src[state.src];
    var c=city(),ml=$("maplink");
    if(state.from&&state.to){ml.href="https://2gis.kz/"+c[2]+"/directions/points/"+state.from.lon+"%2C"+state.from.lat+"%7C"+state.to.lon+"%2C"+state.to.lat;ml.hidden=false}
    else ml.hidden=true;
    $("rtitle").textContent=(state.from&&state.to)?short(state.from.name)+" → "+short(state.to.name):t().prices;
    $("rsub").textContent=t().cls[state.cls]+" · "+t().estimate;

    var p=prices();
    var avail=[],na=[];
    APPS.forEach(function(a){var r=p[a.id],o={a:a,r:r,mid:(r.lo+r.hi)/2};(a.tn[state.cls]?avail:na).push(o)});
    avail.sort(function(x,y){return x.mid-y.mid});
    var bi=0;while(bi<avail.length-1&&avail[bi].r.risk)bi++;
    var box=$("apps");box.innerHTML="";
    avail.forEach(function(x,i){
      var r=x.r,a=x.a,best=i===bi,cheap=i===0&&!best,link=deepLink(a),diff=x.mid-avail[bi].mid;
      var el=document.createElement("div");el.className="app"+(best?" best":"");
      el.innerHTML="<div class='ic' style='background:"+a.col+"'>"+a.mono+"</div>"+
        "<div class='nm'>"+a.name+" <span class='tn'>"+a.tn[state.cls]+"</span>"+(best?"<span class='pill'>"+t().best+"</span>":"")+(cheap?"<span class='pill warn'>"+t().cheapHard+"</span>":"")+"</div>"+
        "<div class='pr'><b>"+money(r.lo)+"</b><small>"+(r.bid?t().bidRange+" – "+money(r.hi):(diff>5?"+"+money(diff):"&nbsp;"))+"</small></div>"+
        "<div class='ds'><span class='w'"+(r.risk?" style='color:var(--warn)'":"")+">"+icon("clock")+r.wait+"</span><span>"+r.tag+"</span></div>"+
        "<div class='go'>"+(link?"<a class='btn pri' href='"+link+"' target='_blank' rel='noopener'>"+icon("ext")+t().openRoute+"</a>":
          (state.to?"<button type='button' class='btn copy'>"+icon("copy")+"<span>"+t().copyDest+"</span></button>":""))+
          "<a class='btn' href='"+a.play+"' target='_blank' rel='noopener'>"+icon("ext")+"Android</a>"+
          "<a class='btn' href='"+a.ios+"' target='_blank' rel='noopener'>"+icon("ext")+"iPhone</a></div>";
      var cb=el.querySelector(".copy");if(cb)cb.addEventListener("click",function(){copyDest(cb)});
      box.appendChild(el);
    });
    na.forEach(function(x){
      var el=document.createElement("div");el.className="app na";
      el.innerHTML="<div class='ic' style='background:"+x.a.col+"'>"+x.a.mono+"</div><div class='nm'>"+x.a.name+"</div><div class='pr'><small>"+t().na+"</small></div><div class='ds'></div>";
      box.appendChild(el);
    });
  }
  function short(s){return s.length>22?s.slice(0,21)+"…":s}

  // ---------- real quotes ----------
  function buildQuotes(){
    var g=$("qgrid"),old={};
    APPS.forEach(function(a){var i=$("q-"+a.id);if(i)old[a.id]=i.value});
    g.innerHTML="";
    APPS.forEach(function(a){
      var l=document.createElement("label");
      l.innerHTML=a.name+"<input type='number' inputmode='numeric' id='q-"+a.id+"' placeholder='₸'>";
      g.appendChild(l);var inp=l.querySelector("input");inp.value=old[a.id]||"";inp.addEventListener("input",quotes);
    });
    quotes();
  }
  function quotes(){
    var v=APPS.map(function(a){return {n:a.name,v:parseFloat($("q-"+a.id).value)}}).filter(function(x){return x.v>0}).sort(function(a,b){return a.v-b.v});
    var o=$("qout");
    if(v.length<2){o.innerHTML="<span class='qhint'>"+t().qHint+"</span>";return}
    var b=v[0],w=v[v.length-1],f=function(n){return n.toLocaleString("ru-RU")};
    o.innerHTML=lang==="ru"
      ?"<b>"+b.n+"</b> — "+t().qPick+": "+f(b.v)+" ₸. На "+f(w.v-b.v)+" ₸ ("+Math.round((w.v-b.v)/w.v*100)+"%) "+t().qCheaper+" "+w.n+"."
      :"<b>"+b.n+"</b> "+t().qPick+": "+f(b.v)+" ₸. "+w.n+"-дан "+f(w.v-b.v)+" ₸ ("+Math.round((w.v-b.v)/w.v*100)+"%) "+t().qCheaper+".";
  }

  // sample route so the page opens with a real comparison
  var ps=places();
  if(ps.length>1){
    state.from={name:L(ps[1]),pair:[ps[1][0],ps[1][1]],lat:ps[1][3],lon:ps[1][4]};
    state.to={name:L(ps[0]),pair:[ps[0][0],ps[0][1]],lat:ps[0][3],lon:ps[0][4]};
    $("from").value=state.from.name;$("to").value=state.to.name;
  }
  applyLang();
  initMap();
  updateRoute();
  window.addEventListener("resize",function(){if(!mapReady)drawMap()});
})();
</script>

</body>
